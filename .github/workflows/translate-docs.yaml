name: Translate docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Read README.md
        run: |
          {
            echo 'README<<EOF'
            cat README.md
            echo 'EOF'
          } >> $GITHUB_ENV
      - name: Translate to Portuguese
        id: portuguese
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          prompt: |
            Translate to Portuguese. Maintain all original Markdown formatting, headers, links, and code blocks.
            Output ONLY the translated text and nothing else.

            ${{ env.README }}
      - name: Write README-PT.md
        env:
          TRANSLATED_TEXT: ${{ steps.portuguese.outputs.summary }}
        run: |
          printf '%s\n' "$TRANSLATED_TEXT" > README-PT.md
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update translations [skip ci]"
